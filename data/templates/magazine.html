<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
</head>
<body>
  <section style="max-width:680px;margin:0 auto;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;color:#1a1a1a;line-height:1.85;background:#faf8f5;">
    <div style="padding:28px 20px 8px;border-bottom:1px solid #e8e2d9;">
      <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.12em;color:#8b7355;text-transform:uppercase;">文枢 · 杂志</p>
      <h1 style="font-size:24px;font-weight:700;margin:0;color:#2c2416;">{{title}}</h1>
    </div>
    <div style="padding:22px 20px 32px;font-size:16px;color:#3d3428;">
{{content}}
    </div>
  </section>
</body>
</html>
